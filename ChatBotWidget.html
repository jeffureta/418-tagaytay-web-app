<!-- Unit 418 Serin East ChatBot Client Widget -->
<div id="condo-chatbot-widget" class="condo-chatbot-container" role="dialog" aria-modal="true" aria-label="Chat Bot">
  <div class="chatbot-header">
    <span class="chatbot-title">Chat Bot</span>
    <button type="button" class="chatbot-close-btn" aria-label="Close Chat" onclick="toggleCondoChatbot(false)">✕</button>
  </div>
  <div class="chatbot-quick-actions" id="chatbotQuickActions" role="group" aria-label="Quick options"></div>
  <div class="chatbot-messages" id="chatbotMessages" role="log" aria-live="polite"></div>
  <form class="chatbot-input-bar" id="chatbotInputForm" onsubmit="handleChatbotSubmit(event)">
    <label for="chatbotInput" class="sr-only">Type a question</label>
    <input type="text" id="chatbotInput" placeholder="Type a question or select an option..." autocomplete="off" />
    <button type="submit" id="chatbotSendBtn" aria-label="Send Message">Send</button>
  </form>
</div>

<script>
var CondoChatbotWidget = (function() {

nu","icon":"","target":"root"}]}},"resolutions":{"res_parking":{"id":"res_parking","title":"Parking Information","text":"🚗 **Parking Options at Unit 418 Serin East Tagaytay**:\n\n1. **Covered Tower Parking Slot**: Dedicated covered parking is available at **₱350 per night** (co-terminous with your 2:00 PM check-in to 12:00 NN check-out). Advance reservation with vehicle make, model, color, and plate number is required for building administration clearance.\n2. **Free Street Parking**: Free street parking is available along the street directly in front of Serin East Tower (first-come, first-served basis).\n\nWould you like to reserve the covered parking slot?","actions":[{"label":"Reserve Covered Parking (₱350)","actionType":"lead","payload":{"service":"parking_reservation"}},{"label":"Back to Menu","actionType":"navigate","target":"root"}]},"res_checkin":{"id":"res_checkin","title":"Check-In, Check-Out & Smart Lock PIN","text":"🔑 **Standard Hours & Smart Lock Access**:\n\n• **Check-In**: 2:00 PM (14:00)\n• **Check-Out**: 12:00 NN (12:00)\n• **Caretaker Turnover Window**: 12:00 NN – 2:00 PM\n\n🔒 **Smart Lock PIN Release Gate**:\nYour unique 6-digit smart lock PIN is generated specifically for your reservation and is released **on your check-in day upon arrival**, once:\n1. Your building endorsement is submitted and verified via the Carrd link.\n2. The caretaker has completed the 12NN–2PM sanitization and unit setup.","actions":[{"label":"Open Endorsement Carrd","actionType":"link","url":"https://serineasttagaytayendorsement.carrd.co/"},{"label":"Back to Menu","actionType":"navigate","target":"root"}]},"res_endorsement":{"id":"res_endorsement","title":"Building Admin Endorsement Clearance","text":"📋 **Mandatory Serin East Building Administration Endorsement**:\n\nPer Serin East Tagaytay condominium security rules, all incoming guests must be officially endorsed before lobby entry.\n\n🔗 **Submission Link**: [serineasttagaytayendorsement.carrd.co](https://serineasttagaytayendorsement.carrd.co/)\n\n**Required Requirements**:\n1. One (1) Valid Government-issued ID of the Primary Guest.\n2. Full complete names of all accompanying guests.\n3. One (1) active mobile contact number.\n4. Vehicle plate & model details (if booking the ₱350/night covered parking slot).","actions":[{"label":"Submit Endorsement Now","actionType":"link","url":"https://serineasttagaytayendorsement.carrd.co/"},{"label":"Back to Menu","actionType":"navigate","target":"root"}]},"res_rules":{"id":"res_rules","title":"Kitchen & Unit House Rules","text":"🍳 **Kitchen & House Rules for Unit 418**:\n\n• **Light Cooking**: Allowed! The kitchen is equipped with an induction cooktop, range hood, microwave, refrigerator, rice cooker, electric kettle, and cookware/utensils.\n• **Strict No-Smelly-Frying Rule**: Strictly **no frying of dried fish (tuyo, daing, tinapa)** or strong pungent foods to preserve unit freshness for incoming guests.\n• **Smoking & Vaping**: Strictly prohibited inside the unit and balcony per condominium regulations.\n• **Quiet Hours**: 10:00 PM to 8:00 AM.","actions":[{"label":"Back to Menu","actionType":"navigate","target":"root"}]},"res_amenities":{"id":"res_amenities","title":"Swimming Pool, Wi-Fi & Appliances","text":"🏊 **Amenities & Appliances**:\n\n• **Fiber Wi-Fi**: High-speed internet throughout the 2BR suite.\n• **Entertainment**: Smart TV with Netflix access.\n• **Bathroom**: Hot and cold shower heater + fresh guest towels.\n• **Swimming Pool**: Serin East outdoor pool access is managed by the building administration. Guest pool passes are paid directly to the admin office on the day of use.\n• **Air Conditioning**: Air-conditioned bedrooms and living area.","actions":[{"label":"Back to Menu","actionType":"navigate","target":"root"}]},"res_contact":{"id":"res_contact","title":"Contact Host & Caretaker","text":"📞 **Need immediate assistance?**\n\n• Our on-site caretaker coordinates unit preparation and turnovers between 12:00 NN and 2:00 PM.\n• You can reach host management directly via Messenger, Viber, WhatsApp, or phone call once your booking is confirmed.","actions":[{"label":"Back to Menu","actionType":"navigate","target":"root"}]},"res_booking_direct":{"id":"res_booking_direct","title":"Direct Booking","text":"🏷️ **Direct Booking Advantage**:\n\nBook directly through our website to secure instant reservation confirmation with no platform service fees!\n\n• **Payment Channels**: BDO / BPI Philippine Bank Transfer or GCash.\n• **Security Deposit**: ₱3,000 refundable security deposit (refunded promptly after checkout inspection).","actions":[{"label":"Inquire for Dates","actionType":"lead","payload":{"service":"direct_quote"}},{"label":"Back to Booking Menu","actionType":"navigate","target":"menu_booking"}]},"res_booking_ota":{"id":"res_booking_ota","title":"OTA Booking Channels","text":"🌐 **We are also listed on major booking platforms**:\n\n• **Airbnb**: Instant booking with PayPal / Credit Card and Airbnb AirCover protection.\n• **Agoda & Booking.com**: Philippine bank and card payments accepted. (Note: Agoda direct bookings require a ₱3,000 refundable security deposit at check-in).","actions":[{"label":"Back to Booking Menu","actionType":"navigate","target":"menu_booking"}]},"res_booking_deposit":{"id":"res_booking_deposit","title":"Security Deposit Policy","text":"💵 **Security Deposit Policies by Channel**:\n\n• **Direct Bookings & Agoda**: A **₱3,000 refundable security deposit** is collected upon check-in. This is refunded in full post-checkout once the caretaker completes the inventory inspection.\n• **Airbnb**: Covered under Airbnb AirCover protection (no upfront cash deposit collected).","actions":[{"label":"Back to Booking Menu","actionType":"navigate","target":"menu_booking"}]}},"faq_topics":[{"id":"parking","title":"Parking Rules & Rates","keywords":["parking","park","car","sasakyan","kotse","parada","paradahan","covered parking","tower parking","street parking","magkano parking"],"responses":{"en":"Covered tower parking is available for ₱350/night (requires advance plate and vehicle details). Free street parking is also available in front of Serin East Tower.","tl":"May covered tower parking sa halagang ₱350/gabi (kailangan lang ng plate number bago dumating). May libreng street parking din sa harap ng Serin East.","taglish":"Covered parking is available for ₱350/night with advance plate number reservation po. Meron din free street parking in front of Serin East Tower."}},{"id":"checkin_checkout","title":"Check-in and Check-out Times","keywords":["check-in","checkin","check-out","checkout","oras","time","dating","alis","arrival","departure","anong oras"],"responses":{"en":"Check-in is strictly at 2:00 PM and check-out is at 12:00 NN to give our caretaker the required 12NN–2PM turnover sanitization window.","tl":"Ang check-in ay 2:00 PM at ang check-out ay 12:00 NN upang magkaroon ng sapat na oras ang caretaker para maglinis mula 12NN hanggang 2PM.","taglish":"Standard check-in is at 2:00 PM and check-out is at 12:00 NN po para sa 12NN–2PM turnover sanitization."}},{"id":"smart_lock","title":"Smart Lock PIN Release","keywords":["lock","pin","code","smart lock","digital lock","paano pumasok","door code","susi","key"],"responses":{"en":"Your unique digital lock PIN is released on arrival day once your Carrd endorsement is submitted and the caretaker confirms unit readiness.","tl":"Ang inyong 6-digit smart lock PIN ay ibinibigay sa araw ng check-in kapag na-submit na ang Carrd endorsement at handa na ang unit.","taglish":"Ang smart lock PIN po ay isesend on check-in day upon arrival after ma-submit ang Carrd endorsement and ready na ang unit."}},{"id":"endorsement","title":"Carrd Endorsement Link","keywords":["endorsement","carrd","id","admin","clearance","requirements","bisita","guest list","form"],"responses":{"en":"All guests must submit their endorsement via https://serineasttagaytayendorsement.carrd.co/ with 1 valid ID of the primary guest and names of all guests.","tl":"Lahat ng guests ay kailangang mag-submit sa https://serineasttagaytayendorsement.carrd.co/ kalakip ang 1 valid ID at kumpletong listahan ng kasama.","taglish":"Required po mag-submit ng endorsement sa https://serineasttagaytayendorsement.carrd.co/ with 1 valid primary ID and names ng lahat ng kasama bago pumasok."}},{"id":"cooking","title":"Kitchen & Cooking","keywords":["cook","cooking","luto","magluto","kitchen","stove","microwave","tuyo","daing","prito","frying","lutuan"],"responses":{"en":"Light cooking is allowed with our induction stove, microwave, and rice cooker. Strictly no smelly frying (such as dried fish/tuyo).","tl":"Pwedeng magluto ng light meals sa induction stove, microwave, at rice cooker. Mahigpit na bawal ang malalansang prito tulad ng tuyo o daing.","taglish":"Yes, allowed po mag-light cooking with induction, microwave, and rice cooker. Strictly no smelly frying like tuyo or daing po."}},{"id":"security_deposit","title":"Security Deposit Policy","keywords":["deposit","security deposit","refundable","3000","aircover","bond","pera"],"responses":{"en":"Direct bookings and Agoda require a refundable ₱3,000 security deposit at check-in. Airbnb bookings are covered by AirCover.","tl":"May ₱3,000 refundable security deposit sa direct at Agoda bookings na ibinabalik pagka-checkout. Sa Airbnb naman ay covered ng AirCover.","taglish":"For direct and Agoda bookings, may ₱3,000 refundable security deposit upon check-in. For Airbnb, covered na po by AirCover."}}]};

  function getGuestStatus() {
    try {
      if (typeof localStorage !== 'undefined') {
        return localStorage.getItem('condo_guest_status') || 'unbooked';
      }
    } catch (e) {}
    return 'unbooked';
  }

  function setGuestStatus(status) {
    try {
      if (typeof localStorage !== 'undefined') {
        localStorage.setItem('condo_guest_status', status);
      }
    } catch (e) {}
    refreshMenu();
  }

  function appendMsg(sender, text) {
    var container = document.getElementById('chatbotMessages');
    if (!container) return;
    var el = document.createElement('div');
    el.className = 'message ' + sender;
    var formatted = (text || '')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\[(.*?)\]\((https?:\/\/.*?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/\n/g, '<br/>');
    el.innerHTML = formatted;
    container.appendChild(el);
    container.scrollTop = container.scrollHeight;
  }

  function renderOptions(options) {
    var tray = document.getElementById('chatbotQuickActions');
    if (!tray) return;
    tray.innerHTML = '';
    if (!Array.isArray(options) || options.length === 0) return;

    for (var i = 0; i < options.length; i++) {
      (function(opt) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'option-btn';
        btn.textContent = (opt.icon ? opt.icon + ' ' : '') + opt.label;
        btn.onclick = function() {
          handleOptionClick(opt);
        };
        tray.appendChild(btn);
      })(options[i]);
    }
  }

  function getRootOptions() {
    var status = getGuestStatus();
    var all = (KB.menu_tree && KB.menu_tree.root && KB.menu_tree.root.options) || [];
    if (status === 'confirmed') {
      return all;
    }
    var unbooked = [];
    for (var i = 0; i < all.length; i++) {
      if (all[i].tier === 'unbooked') {
        unbooked.push(all[i]);
      }
    }
    // Add cross-device sync recovery option for unbooked visitors
    unbooked.push({
      id: 'opt_sync_booking',
      label: 'Already booked? Sync reference',
      icon: '',
      actionType: 'sync_booking'
    });
    return unbooked;
  }

  function refreshMenu() {
    renderOptions(getRootOptions());
  }

  function handleOptionClick(opt) {
    appendMsg('guest', opt.label);

    if (opt.actionType === 'sync_booking') {
      promptSyncBooking();
      return;
    }

    var target = opt.target || opt.id;

    if (opt.actionType === 'link' && opt.url) {
      window.open(opt.url, '_blank', 'noopener,noreferrer');
      return;
    }

    if (KB.menu_tree && KB.menu_tree[target]) {
      var menu = KB.menu_tree[target];
      if (menu.message || menu.title) {
        appendMsg('bot', menu.message || menu.title);
      }
      renderOptions(menu.options);
    } else if (KB.resolutions && KB.resolutions[target]) {
      var res = KB.resolutions[target];
      appendMsg('bot', res.text);
      if (res.actions) {
        renderOptions(res.actions.map(function(a) {
          return {
            id: a.target || 'root',
            target: a.target || 'root',
            label: a.label,
            icon: a.actionType === 'link' ? '🔗' : '👉',
            actionType: a.actionType,
            url: a.url
          };
        }));
      }
    } else {
      refreshMenu();
    }
  }

  function promptSyncBooking() {
    var ref = window.prompt('Please enter your 4-digit booking Reference ID (e.g. CND-1234 or 1234):');
    if (!ref) {
      appendMsg('bot', 'No reference ID provided. Showing general staycation topics.');
      refreshMenu();
      return;
    }
    ref = ref.trim().toUpperCase();
    if (!ref.startsWith('CND-')) ref = 'CND-' + ref;

    appendMsg('bot', 'Verifying reservation #' + ref + '...');

    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.success) {
            setGuestStatus('confirmed');
            appendMsg('bot', '✅ Reservation confirmed! Unlocked all guest topics (smart lock, endorsement, pool, Wi-Fi, rules).');
          } else {
            appendMsg('bot', '⚠️ Could not find reservation #' + ref + '. Please check the ID or contact host.');
            refreshMenu();
          }
        })
        .withFailureHandler(function() {
          setGuestStatus('confirmed');
          appendMsg('bot', '✅ Reservation restored offline for #' + ref + '. Unlocked all guest topics.');
        })
        .lookupReservation(ref);
    } else {
      // Offline / local preview mock
      setGuestStatus('confirmed');
      appendMsg('bot', '✅ Reservation confirmed for #' + ref + '! Unlocked all guest topics.');
    }
  }

  function matchFaqText(text) {
    if (!text) return null;
    var clean = text.toLowerCase();
    var topics = KB.faq_topics || [];
    for (var i = 0; i < topics.length; i++) {
      var t = topics[i];
      for (var k = 0; k < t.keywords.length; k++) {
        if (clean.indexOf(t.keywords[k].toLowerCase()) !== -1) {
          var lang = (clean.indexOf('po') !== -1 || clean.indexOf('ba') !== -1) ? 'taglish' : 'en';
          return t.responses[lang] || t.responses.en || t.responses.taglish;
        }
      }
    }
    return null;
  }

  function handleUserMessage(query) {
    if (!query) return;
    appendMsg('guest', query);

    var faqAnswer = matchFaqText(query);
    if (faqAnswer) {
      appendMsg('bot', faqAnswer);
    } else {
      appendMsg('bot', 'Maraming salamat po! For detailed information regarding rates, covered parking (₱350/night), smart lock, and endorsement, please choose an option below.');
      refreshMenu();
    }
  }

  function init() {
    console.log('[ChatBotWidget] Initialized');
    // Clean initial message log - no welcome greeting bubble
    refreshMenu();
  }

  return {
    init: init,
    handleUserMessage: handleUserMessage,
    handleOptionClick: handleOptionClick,
    setGuestStatus: setGuestStatus,
    getGuestStatus: getGuestStatus,
    refreshMenu: refreshMenu
  };
})();

function toggleCondoChatbot(forcedState) {
  var widget = document.getElementById('condo-chatbot-widget');
  var launcher = document.getElementById('condoChatbotLauncher');
  if (!widget) return;

  var isOpen = widget.classList.contains('is-open');
  var nextState = typeof forcedState === 'boolean' ? forcedState : !isOpen;

  if (nextState) {
    widget.classList.add('is-open');
    if (launcher) {
      launcher.setAttribute('aria-expanded', 'true');
      launcher.classList.add('is-hidden');
    }
    var isMobile = typeof window !== 'undefined' && window.innerWidth && window.innerWidth <= 640;
    if (isMobile && document.body) {
      document.body.style.overflow = 'hidden';
    } else {
      var input = document.getElementById('chatbotInput');
      if (input) input.focus();
    }
  } else {
    widget.classList.remove('is-open');
    if (launcher) {
      launcher.setAttribute('aria-expanded', 'false');
      launcher.classList.remove('is-hidden');
    }
    if (document.body) document.body.style.overflow = '';
  }
}

function handleChatbotSubmit(event) {
  if (event && event.preventDefault) event.preventDefault();
  var input = document.getElementById('chatbotInput');
  if (!input) return;
  var text = (input.value || '').trim();
  if (text) {
    CondoChatbotWidget.handleUserMessage(text);
    input.value = '';
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', CondoChatbotWidget.init);
} else {
  CondoChatbotWidget.init();
}
</script>
